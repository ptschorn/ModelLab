<!--

  © 2026 Patrick Tschorn

<script>
/* =====================================================================
   DIAGRAMMBEREICHE EIN- UND AUSSCHALTEN
   true = Bereich ist verfügbar, false = Bereich ist ausgeblendet.
   Ist nur EIN Bereich eingeschaltet, verhält sich die App wie das
   frühere Einzel-Werkzeug (Name, Logo, Farbe und Speicher von UMLab,
   DBLab bzw. AlgoLab).
   aufgaben schaltet das Aufgaben-Fenster unabhängig von den Bereichen.
   ===================================================================== */
var DGS_MODULES={
  uml:  true,   // UML: Klassen-, Zustands-, Sequenz-, Aktivitäts-, Anwendungsfalldiagramm
  db:   true,   // Datenbank: ER-Diagramm, relationales Datenmodell
  algo: true,   // Algorithmen: Struktogramm, Programmablaufplan
  aufgaben: true  // Aufgaben-Fenster (Knopf „Aufgabe“, Aufgaben-Dateien öffnen/speichern)
};
/* ---------------------------------------------------------------------
   AUSWAHL PER LINK (ab 1.3.21)
   Am Link angehängt, z. B.  index.html?tool=umlab
     ?tool=umlab | dblab | algolab | modellab
     ?bereiche=uml,db          (uml, db, algo – mit Komma getrennt)
     ?aufgaben=aus             (aus/0/nein bzw. an/1/ja)
   Kombinierbar: ?tool=dblab&aufgaben=aus . Geht auch hinter # statt ?.
   Der Link kann nur EINSCHRÄNKEN: Was oben auf false steht, bleibt aus.
   --------------------------------------------------------------------- */
(function(){try{
  var q=new URLSearchParams((location.search||'').slice(1)+'&'+(location.hash||'').slice(1));
  var M=DGS_MODULES,K=['uml','db','algo'],T={umlab:['uml'],uml:['uml'],dblab:['db'],db:['db'],algolab:['algo'],algo:['algo'],modellab:K,alle:K};
  var g=function(n){var v=q.get(n);return v==null?null:String(v).trim().toLowerCase();};
  var tool=g('tool')||g('app'),ber=g('bereiche')||g('module')||g('m'),auf=g('aufgaben')||g('aufgabe');
  var want=null;
  if(tool&&T[tool])want=T[tool];
  if(ber){var l=ber.split(/[ ,;|]+/).reduce(function(a,x){return a.concat(T[x]||[]);},[]);if(l.length)want=l;}
  if(want){var ok=K.filter(function(k){return M[k]!==false&&want.indexOf(k)>=0;});if(ok.length)K.forEach(function(k){M[k]=ok.indexOf(k)>=0;});}
  if(auf!=null){if(/^(0|aus|nein|false|off|no)$/.test(auf))M.aufgaben=false;}
}catch(e){}})();
</script>

<style>
:root{
  --bg:#E8EBE5;--panel:#F7F8F4;--soft:#E0E5DC;--ink:#1B2420;--muted:#5A665E;--line:#C9D0C6;
  --accent:#058B8C;--accent-ink:#FFFFFF;--sel:#CF7418;--canvas:#FBFCF9;--grid:#CAD2C7;
  --nodefill:#FFFFFF;--notefill:#FFF4D2;--contfill:#F3F6F0;--danger:#A8321F;--c-el:#058B8C;--c-rel:#B85E22;--c-misc:#5B4FC4;--c-life:#2E72C2;--c-frag:#B23C82;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111614;--panel:#19201D;--soft:#232C28;--ink:#E2E8E3;--muted:#98A69D;--line:#313B36;
    --accent:#3DBDBE;--accent-ink:#04201F;--sel:#F0A04B;--canvas:#141A17;--grid:#2B3530;
    --nodefill:#1C2421;--notefill:#3A3421;--contfill:#18201C;--danger:#F0A395;--c-el:#3DBDBE;--c-rel:#E8955A;--c-misc:#A49BF0;--c-life:#7AAEEF;--c-frag:#E688C0;--c-life:#7AAEEF;--c-frag:#E688C0;--c-el:#3DBDBE;--c-rel:#E8955A;--c-misc:#A49BF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614;--panel:#19201D;--soft:#232C28;--ink:#E2E8E3;--muted:#98A69D;--line:#313B36;
  --accent:#3DBDBE;--accent-ink:#04201F;--sel:#F0A04B;--canvas:#141A17;--grid:#2B3530;
  --nodefill:#1C2421;--notefill:#3A3421;--contfill:#18201C;--danger:#F0A395;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:12px 16px 16px}
.top{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap}

  const ref=n=>n.type==='initial'||n.type==='final'?'[*]':n.type==='history'?(n.deep?'[H*]':'[H]'):al[n.id].a;
  const scope=e=>{const a=byId[e.from],b=byId[e.to];if(a&&pseudo(a))return par[a.id];if(b&&pseudo(b))return par[b.id];return null;};
  function edges(pid,ind){d.edges.forEach(e=>{if(e.type!=='transition')return;const a=byId[e.from],b=byId[e.to];if(!a||!b||scope(e)!==pid)return;

    if(e.type==='assoc')o.push(`${a.a}${e.m1?' '+q(e.m1):''} ${e.nav1==='arrow'?'<':''}--${e.nav2==='arrow'?'>':''}${e.m2?' '+q(e.m2):''} ${b.a}`);else if(e.type==='include')o.push(`${a.a} ..> ${b.a} : <<include>>`);

PU.layers=function(items,links,gx,gy){const ids=items.map(i=>i.id),has=new Set(ids),out={},inn={};ids.forEach(id=>{out[id]=[];inn[id]=[];});

PU.noteHandler=function(ctx){/* returns fn(line)->bool */

/* Klassendiagramm */
PU.cls=function(lines,res){const nodes=[],edges=[],map={},sk=res.skipped;let cur=null,depth=0;
  const get=(nm,create=true)=>{nm=PU.uq(nm);if(map[nm])return map[nm];if(!create)return null;const n={id:uid(),type:'class',x:0,y:0,name:nm,stereo:'',abstract:false,attrs:'',ops:''};nodes.push(n);map[nm]=n;return n;};
  const member=(n,t)=>{t=t.trim();if(!t||/^(--|==|\.\.|__)/.test(t))return;
    if(n.type==='enum'){t.split(/\s*,\s*/).filter(Boolean).forEach(v=>{n.values=(n.values?n.values+'\n':'')+v.replace(/[;,]$/,'');});return;}
    if(t.includes('('))n.ops=(n.ops?n.ops+'\n':'')+t;else n.attrs=(n.attrs?n.attrs+'\n':'')+t;};
  const notes=PU.noteHandler({find:nm=>get(nm,false),add:(text,target,alias)=>{const n={id:uid(),type:'note',x:0,y:0,text};nodes.push(n);if(alias)map[alias]=n;if(target)edges.push({id:uid(),type:'anchor',from:n.id,to:target.id});},last:()=>nodes.filter(n=>n.type!=='note').slice(-1)[0]});

    if(notes(l))continue;

      const ib=rest.match(/\{(.*)\}\s*$/);if(ib){inline=ib[1];rest=rest.slice(0,ib.index);}else if(/\{\s*$/.test(rest)){open=true;rest=rest.replace(/\{\s*$/,'');}
      let stereo='';rest=rest.replace(/<<\s*([^>]+?)\s*>>/,(x,s)=>{stereo=s;return'';}).replace(/#[\w#]+/g,'').replace(/\s+(extends|implements)\s+.*$/i,'');

      if(/\|>|\^/.test(R)||/<\|/.test(L)||L==='^'){type=dot?'realization':'inheritance';if(/<\|/.test(L)||L==='^')swap=true;}

      else if(L==='o'||L.includes('o'))type='aggregation';else if(R==='o'||R.includes('o')){type='aggregation';swap=true;}
      else if(dot){if(A.type==='note'||B.type==='note')type='anchor';else if(L.includes('<')){type='dependency';swap=true;}else type='dependency';}

        if(la&&ra)type='bidir';else if(lx&&ra)type='navx';else if(rx&&la){type='navx';swap=true;}else if(ra)type='directed';else if(la){type='directed';swap=true;}else type='assoc';}
      let name=r.label,readDir='';if(/\s*>$/.test(name)){readDir='fwd';name=name.replace(/\s*>$/,'');}else if(/^<\s*/.test(name)){readDir='back';name=name.replace(/^<\s*/,'');}
      const e={id:uid(),type,from:(swap?B:A).id,to:(swap?A:B).id};
      const ml=swap?r.m2:r.m1,mr=swap?r.m1:r.m2;
      if(type!=='inheritance'&&type!=='realization'&&type!=='anchor'){if(ml)e.m1=ml;if(mr)e.m2=mr;if(name)e.name=PU.uq(name);if(readDir&&name)e.readDir=swap?(readDir==='fwd'?'back':'fwd'):readDir;}

/* Zustandsdiagramm */
PU.state=function(lines,res){const nodes=[],edges=[],sk=res.skipped,byName={},pseudo={},scopes=[null];
  const sc=()=>scopes[scopes.length-1];
  const getS=(nm,create=true)=>{nm=PU.uq(nm);if(byName[nm])return byName[nm];if(!create)return null;const n={id:uid(),type:'state',x:0,y:0,name:nm,entry:'',doA:'',exit:'',inner:'',_p:sc()};nodes.push(n);byName[nm]=n;return n;};
  const ref=(tok,asT)=>{tok=tok.trim();if(tok==='[*]'){const k=sc()+'|'+(asT?'f':'i');if(!pseudo[k]){const n={id:uid(),type:asT?'final':'initial',x:0,y:0,_p:sc()};nodes.push(n);pseudo[k]=n;}return pseudo[k];}
    if(/^\[H\*?\]$/i.test(tok)){const deep=tok.includes('*'),k=sc()+'|H'+deep;if(!pseudo[k]){const n={id:uid(),type:'history',deep,x:0,y:0,_p:sc()};nodes.push(n);pseudo[k]=n;}return pseudo[k];}

  const notes=PU.noteHandler({find:nm=>getS(nm,false),add:(text,target,alias)=>{const n={id:uid(),type:'note',x:0,y:0,text,_p:target?target._p:sc()};nodes.push(n);if(alias)byName[alias]=n;if(target)edges.push({id:uid(),type:'anchor',from:n.id,to:target.id});},last:()=>nodes.filter(n=>n.type==='state').slice(-1)[0]});
  for(const l of lines){let m;
    if(l==='}'){if(scopes.length>1)scopes.pop();continue;}
    if(l==='--'||l==='||'){sk.push(l+' (parallele Bereiche)');continue;}
    if(notes(l))continue;
    if((m=l.match(/^state\s+(.+)$/i))){let rest=m[1],open=false,d0='';if(/\{\s*$/.test(rest)){open=true;rest=rest.replace(/\{\s*$/,'');}
      let stereo='';rest=rest.replace(/<<\s*([^>]+?)\s*>>/,(x,s)=>{stereo=s.toLowerCase();return'';}).replace(/#[\w#;:.]+/g,'');
      const ci=rest.search(/\s:\s|:\s|\s:$/);if(ci>=0&&!/^"/.test(rest.slice(ci))){d0=rest.slice(ci).replace(/^\s*:\s*/,'');rest=rest.slice(0,ci);}

      if(stereo==='choice'||stereo==='fork'||stereo==='join')n.type='choice';
      else if(stereo==='end')n.type='final';else if(stereo)sk.push('state '+dc.name+' <<'+stereo+'>> (als Zustand übernommen)');

      const e={id:uid(),type:'transition',from:A.id,to:B.id};const t=r.label.match(/^(.*?)\s*(?:\[([^\]]*)\])?\s*(?:\/\s*(.*))?$/);
      if(t){if(t[1])e.trigger=t[1].trim();if(t[2])e.guard=t[2].trim();if(t[3])e.effect=t[3].trim();}edges.push(e);continue;}

/* Aktivitätsdiagramm */
PU.act=function(lines,res){const nodes=[],edges=[],sk=res.skipped,lanes=[];let lane=0,cur=[],stack=[],buf=null,skipNote=false;
  const mk=(type,p)=>{const n=Object.assign({id:uid(),type,x:0,y:0,_lane:lane},p||{});nodes.push(n);return n;};
  const link=(a,b,g)=>{const e={id:uid(),type:'flow',from:a.id,to:b.id};if(g)e.guard=g;edges.push(e);};
  const put=n=>{cur.forEach(c=>link(c.n,n,c.g));cur=[{n}];return n;};

  if(oldStyle){const by={};let init=null,fin=null;const getN=(t,asT)=>{t=t.trim();if(t==='(*)'){if(asT){fin=fin||mk('final');return fin;}init=init||mk('initial');return init;}
      const nm=PU.uq(t.replace(/^"|"$/g,''));if(!by[nm])by[nm]=mk('action',{name:nm});return by[nm];};
    let last=null;for(const l of lines){const r=PU.rel(l.replace(/^-+>/,'X->'),false);let m;
      if((m=l.match(/^-+>\s*(?:\[([^\]]*)\])?\s*(.+)$/))&&last){const B=getN(m[2],true);link(last,B,m[1]);last=B;continue;}
      if(r){const g=(r.right.v.match(/^\[([^\]]*)\]\s*/)||[])[1];const rt=r.right.v.replace(/^\[[^\]]*\]\s*/,'');const A=getN(r.left.v,false),B=getN(rt,true);link(A,B,g);last=B;continue;}
      sk.push(l);}}
  else for(let l of lines){let m;
    if(skipNote){if(/^end\s*note$/i.test(l))skipNote=false;continue;}
    if(buf!==null){buf.push(l);if(/[;|<>\]}/]$/.test(l)){const t=buf.join('\n').replace(/[;|<>\]}/]$/,'');buf=null;put(mk('action',{name:t}));}continue;}

    if(/^(kill|detach)$/i.test(l)){put(mk('flowfinal'));cur=[];continue;}
    if((m=l.match(/^:(.*)$/))){const body=m[1];if(/[;|<>\]}/]$/.test(body)){put(mk('action',{name:body.replace(/[;|<>\]}/]$/,'')}));}else buf=[body];continue;}
    if((m=l.match(/^if\s*\((.*?)\)\s*(?:then\s*(?:\((.*?)\))?)?\s*$/i))){const D=put(mk('decision',{name:m[1]}));stack.push({k:'if',D,ends:[],hasElse:false});cur=[{n:D,g:m[2]||''}];continue;}
    if((m=l.match(/^else\s*if\s*\((.*?)\)\s*(?:then\s*(?:\((.*?)\))?)?\s*$/i))){const f=stack[stack.length-1];if(f&&f.k==='if'){f.ends.push(...cur);cur=[{n:f.D,g:m[1]+(m[2]?' – '+m[2]:'')}];}continue;}
    if((m=l.match(/^else\s*(?:\((.*?)\))?\s*$/i))){const f=stack[stack.length-1];if(f&&f.k==='if'){f.ends.push(...cur);f.hasElse=true;cur=[{n:f.D,g:m[1]||'else'}];}continue;}
    if(/^end\s*if$/i.test(l)){const f=stack.pop();if(f&&f.k==='if'){f.ends.push(...cur);if(!f.hasElse)f.ends.push({n:f.D,g:'else'});const M=mk('decision',{name:''});f.ends.forEach(c=>link(c.n,M,c.g));cur=[{n:M}];}continue;}
    if((m=l.match(/^while\s*\((.*?)\)\s*(?:is\s*\((.*?)\))?\s*$/i))){const D=put(mk('decision',{name:m[1]}));stack.push({k:'while',D});cur=[{n:D,g:m[2]||''}];continue;}
    if((m=l.match(/^end\s*while\s*(?:\((.*?)\))?\s*$/i))){const f=stack.pop();if(f&&f.k==='while'){cur.forEach(c=>link(c.n,f.D,c.g));cur=[{n:f.D,g:m[1]||''}];}continue;}
    if(/^repeat$/i.test(l)){const R=put(mk('decision',{name:''}));stack.push({k:'repeat',R});continue;}
    if((m=l.match(/^repeat\s*while\s*\((.*?)\)\s*(?:is\s*\((.*?)\))?\s*(?:not\s*\((.*?)\))?\s*$/i))){const f=stack.pop();if(f&&f.k==='repeat'){const D=put(mk('decision',{name:m[1]}));link(D,f.R,m[2]||'');cur=[{n:D,g:m[3]||''}];}continue;}

    const lx=[];let acc=0;lw.forEach((w,k)=>{lx[k]=acc;acc+=w;});
    L.L.forEach(r=>{lanes.forEach((_,k)=>{const rr=r.filter(id=>nodes.find(n=>n.id===id)._lane===k);const rowW=rr.reduce((s,id)=>s+sz[id].w,0)+60*Math.max(0,rr.length-1);let x=lx[k]+(lw[k]-rowW)/2;rr.forEach(id=>{L.pos[id].x=Math.round(x);x+=sz[id].w+60;});});});
    nodes.forEach(n=>{n.x=40+L.pos[n.id].x;n.y=40+32+30+L.pos[n.id].y;delete n._lane;});
    nodes.unshift({id:uid(),type:'partition',x:40,y:40,cols:lanes.map((nm,k)=>({name:nm,w:lw[k]})),rows:[],w:acc,h:L.H+60});}
  else{if(lanes.length===1)sk.push('Bereich |'+lanes[0]+'| (nur einer – ohne Aktivitätsbereich übernommen)');nodes.forEach(n=>{n.x=40+L.pos[n.id].x;n.y=40+L.pos[n.id].y;delete n._lane;});}
  return{type:'act',data:{title:res.title,nodes,edges}};};

/* Anwendungsfalldiagramm */
PU.uc=function(lines,res){const nodes=[],edges=[],sk=res.skipped,map={};const scopes=[null];const sc=()=>scopes[scopes.length-1];
  const add=(type,name,alias)=>{const n={id:uid(),type,x:0,y:0,name:PU.uq(name),_p:type==='actor'||type==='actorbox'?null:sc()};if(type==='usecase')n.ext='';nodes.push(n);map[alias||name]=n;map[PU.uq(name)]=n;return n;};
  const resolve=t=>{if(t.k==='uc')return map[t.v]&&map[t.v].type==='usecase'?map[t.v]:add('usecase',t.v,t.v);if(t.k==='actor')return map[t.v]||add('actor',t.v,t.v);const v=PU.uq(t.v);return map[t.v]||map[v]||add('usecase',v,t.v);};
  const notes=PU.noteHandler({find:nm=>map[nm.trim()]||map[PU.uq(nm)],add:(text,target,alias)=>{const n={id:uid(),type:'note',x:0,y:0,text,_p:null};nodes.push(n);if(alias)map[alias]=n;if(target)edges.push({id:uid(),type:'anchor',from:n.id,to:target.id});},last:()=>nodes.slice(-1)[0]});
  for(const l of lines){let m;
    if(l==='}'){if(scopes.length>1)scopes.pop();continue;}
    if(notes(l))continue;
    if((m=l.match(/^actor\/?\s+(.+)$/i))){let rest=m[1].replace(/<<[^>]*>>/,'').replace(/#[\w#]+/g,'');const cm=rest.match(/^:([^:]+):\s*(?:as\s+(\S+))?/);if(cm){add('actor',cm[1],cm[2]||cm[1]);continue;}const d=PU.decl(rest);if(d)add('actor',d.name,d.alias);continue;}
    if((m=l.match(/^:([^:]+):\s*(?:as\s+(\S+))?\s*$/))){add('actor',m[1],m[2]||m[1]);continue;}
    if((m=l.match(/^usecase\/?\s+(.+)$/i))){let rest=m[1].replace(/<<[^>]*>>/,'').replace(/#[\w#]+/g,'');const pm=rest.match(/^\(([^)]+)\)\s*(?:as\s+(\S+))?/);if(pm){add('usecase',pm[1],pm[2]||pm[1]);continue;}const d=PU.decl(rest);if(d)add('usecase',d.name,d.alias);continue;}
    if((m=l.match(/^\(([^)]+)\)\s*(?:as\s+(\S+))?\s*$/))){add('usecase',m[1],m[2]||m[1]);continue;}
    if((m=l.match(/^(rectangle|package|frame|folder|node|cloud|component)\s+(.+?)\s*\{$/i))){const d=PU.decl(m[2].replace(/<<[^>]*>>/,''));const n={id:uid(),type:'system',x:0,y:0,name:d?d.name:'System',w:300,h:200,_p:sc()};nodes.push(n);if(d)map[d.alias]=n;scopes.push(n.id);continue;}
    if((m=l.match(/^rectangle\s+(.+?)\s*<<\s*Akteur\s*>>\s*(?:as\s+(\S+))?\s*$/i))){add('actorbox',PU.uq(m[1]),m[2]||PU.uq(m[1]));continue;}
    const r=PU.rel(l,true);
    if(r){const A=resolve(r.left),B=resolve(r.right);const lab=r.label.toLowerCase();let e;
      if(/include/.test(lab)){e={type:'include',from:A.id,to:B.id};if(r.L.includes('<')&&!r.R.includes('>'))e={type:'include',from:B.id,to:A.id};}
      else if(/extend/.test(lab)){e={type:'extend',from:A.id,to:B.id};if(r.L.includes('<')&&!r.R.includes('>'))e={type:'extend',from:B.id,to:A.id};}
      else if(/\|>|\^/.test(r.R))e={type:'generalization',from:A.id,to:B.id};else if(/<\|/.test(r.L))e={type:'generalization',from:B.id,to:A.id};
      else if(A.type==='note'||B.type==='note')e={type:'anchor',from:A.id,to:B.id};
      else{e={type:'assoc',from:A.id,to:B.id};if(r.R.includes('>'))e.nav2='arrow';if(r.L.includes('<'))e.nav1='arrow';if(r.m1)e.m1=r.m1;if(r.m2)e.m2=r.m2;}
      e.id=uid();edges.push(e);continue;}
    sk.push(l);}
  // Layout
  const meas=n=>PU.measure(UC,n);let ay=40;const actors=nodes.filter(n=>n.type==='actor'||n.type==='actorbox');
  const sysList=nodes.filter(n=>n.type==='system');const free=nodes.filter(n=>n.type==='usecase'&&!n._p);
  const layUC=(list,ox,oy)=>{const cols=list.length>4?2:1;let colH=[0,0];const cw=[0,0];list.forEach((u,i)=>{const s=meas(u);cw[i%cols]=Math.max(cw[i%cols],s.w);});
    list.forEach((u,i)=>{const s=meas(u),c=i%cols;u.x=Math.round(ox+(c?cw[0]+50:0)+(cw[c]-s.w)/2);u.y=Math.round(oy+colH[c]);colH[c]+=s.h+30;});
    return{w:cw[0]+(cols>1?cw[1]+50:0),h:Math.max(...colH)-30};};
  let sx=40+Math.max(60,...actors.map(a=>meas(a).w))+100;let sy=40;
  sysList.filter(s=>!s._p).forEach(s=>{const inner=nodes.filter(n=>n._p===s.id&&n.type==='usecase');const r=layUC(inner,sx+40,sy+60);s.x=sx;s.y=sy;s.w=Math.max(260,r.w+80);s.h=Math.max(160,r.h+100);sy+=s.h+40;});
  if(free.length){const r=layUC(free,sx+(sysList.length?Math.max(...sysList.map(s=>s.w))+60:0),40);}
  const totalH=Math.max(sy,...nodes.filter(n=>n.type==='usecase').map(u=>u.y+60));const step=actors.length?Math.max(110,(totalH-40)/actors.length):110;
  actors.forEach((a,i)=>{a.x=40;a.y=Math.round(40+i*step);});
  let nx=Math.max(...nodes.filter(n=>n.type!=='note').map(n=>n.x+meas(n).w),300)+60,ny=40;nodes.filter(n=>n.type==='note').forEach(n=>{n.x=nx;n.y=ny;ny+=meas(n).h+30;});
  nodes.forEach(n=>delete n._p);
  return{type:'uc',data:{title:res.title,nodes,edges}};};

/* Sequenzdiagramm */
PU.seq=function(lines,res){const parts=[],msgs=[],frags=[],by={},sk=res.skipped,pendingCreate=new Set(),calls=[],fst=[];let numbered=false,skipNote=false;
  const getP=(nm,kind)=>{nm=String(nm).trim();const u=PU.uq(nm);if(by[nm])return by[nm];if(by[u])return by[u];const p={id:uid(),kind:kind||'object',name:u};parts.push(p);by[nm]=p;by[u]=p;return p;};
  const OPS={alt:'alt',opt:'opt',loop:'loop',par:'par',break:'break',critical:'critical'};
  for(const l of lines){let m;
    if(skipNote){if(/^end\s*[hr]?note$/i.test(l))skipNote=false;continue;}
    if((m=l.match(/^(participant|actor|boundary|control|entity|database|collections|queue)\s+(.+)$/i))){const kw=m[1].toLowerCase();const rest=m[2].replace(/<<[^>]*>>/,'').replace(/#[\w#]+/g,'').replace(/\s+order\s+\d+/i,'');const d=PU.decl(rest);if(!d)continue;
      const KM={actor:'actor',boundary:'boundary',control:'control',entity:'entity',database:'database',collections:'database',queue:'server'};const st=(m[2].match(/<<\s*(\w+)\s*>>/)||[])[1];const kk=KM[kw]||(st&&SKINDS.some(x=>x[0]===st)?st:'object');const p=getP(d.alias,kk);p.name=d.name;p.kind=kk;by[d.name]=p;continue;}
    if(/^autonumber\b/i.test(l)){numbered=true;continue;}
    if((m=l.match(/^create\s+(?:participant\s+|actor\s+)?(.+)$/i))){pendingCreate.add(getP(m[1]).id);continue;}
    if((m=l.match(/^destroy\s+(.+)$/i))){const p=getP(m[1]);const last=msgs[msgs.length-1];if(last&&last.to===p.id&&last.type==='sync')last.type='destroy';else p.endAt=last?last.id:'__end';continue;}
    if(/^(activate|deactivate)\b/i.test(l))continue;
    if((m=l.match(/^return\b\s*(.*)$/i))){const c=calls.pop();if(c)msgs.push({id:uid(),type:'reply',from:c.to,to:c.from,label:m[1]||''});continue;}
    if((m=l.match(/^(alt|opt|loop|par|break|critical|group|neg|strict|seq|ignore|consider|assert)\b\s*(.*)$/i))){const op=OPS[m[1].toLowerCase()]||'opt';if(!OPS[m[1].toLowerCase()])sk.push(m[1]+' (als opt übernommen)');fst.push({op,guard:m[2]||'',si:msgs.length,br:[]});continue;}
    if((m=l.match(/^else\b\s*(.*)$/i))){const f=fst[fst.length-1];if(f)f.br.push({i:msgs.length,guard:m[1]||''});continue;}
    if(/^end$/i.test(l)){const f=fst.pop();if(f&&msgs.length>f.si){frags.push({id:uid(),op:f.op,guard:f.guard,start:msgs[f.si].id,end:msgs[msgs.length-1].id,branches:f.br.filter(b=>b.i>f.si&&b.i<msgs.length).map(b=>({at:msgs[b.i].id,guard:b.guard}))});}continue;}
    if(/^[hr]?note\b/i.test(l)){if(!/:/.test(l))skipNote=true;sk.push('Notiz');continue;}
    if(/^(==.*==|\.\.\..*|\|\|\|.*|ref\s+over.*|box\b.*|end\s*box|delay\b.*|space\b.*)$/i.test(l)){if(!/^end\s*box/i.test(l))sk.push(l);continue;}
    const r=PU.rel(l,false);
    if(r){const ext=v=>/^[\[\]?]$/.test(v);if(ext(r.left.v)&&ext(r.right.v)){sk.push(l);continue;}
      let A=ext(r.left.v)?{id:'__out'}:getP(r.left.v),B=ext(r.right.v)?{id:'__out'}:getP(r.right.v);const rev=r.L.includes('<')&&!r.R.includes('>');if(rev)[A,B]=[B,A];
      const hd=r.L+r.R;let type=r.dashed?'reply':/>>|\\|\//.test(hd)?'async':'sync';
      if(pendingCreate.has(B.id)&&A!==B){type='create';pendingCreate.delete(B.id);}
      const msg={id:uid(),type,from:A.id,to:B.id,label:PU.uq(r.label||'')};msgs.push(msg);
      if(type==='sync'&&A!==B)calls.push({from:A.id,to:B.id});else if(type==='reply'){for(let i=calls.length-1;i>=0;i--){if(calls[i].from===B.id&&calls[i].to===A.id){calls.splice(i,1);break;}}}
      continue;}
    sk.push(l);}
  return{type:'seq',data:{title:res.title,showFrame:!!res.title,numbered,parts,msgs,frags}};};

PU.detour=function(nodes0,edges,box){const by={};const nodes=nodes0.map(n=>{const g=box(n);return g?{id:n.id,x:g.x,y:g.y,w:g.w,h:g.h}:null;}).filter(Boolean);nodes.forEach(n=>by[n.id]=n);const C=n=>({x:n.x+n.w/2,y:n.y+n.h/2});const lane={l:0,r:0};
  const inside=(o,n)=>n.x>=o.x-1&&n.y>=o.y-1&&n.x+n.w<=o.x+o.w+1&&n.y+n.h<=o.y+o.h+1;
  const hit=(a,b,r,pad)=>{let t0=0,t1=1;const dx=b.x-a.x,dy=b.y-a.y;const P=[-dx,dx,-dy,dy],Q=[a.x-(r.x-pad),(r.x+r.w+pad)-a.x,a.y-(r.y-pad),(r.y+r.h+pad)-a.y];
    for(let i=0;i<4;i++){if(P[i]===0){if(Q[i]<0)return false;}else{const t=Q[i]/P[i];if(P[i]<0){if(t>t1)return false;if(t>t0)t0=t;}else{if(t<t0)return false;if(t<t1)t1=t;}}}return t1-t0>0.02;};
  edges.forEach(e=>{if(e.from===e.to||(e.pts&&e.pts.length))return;const A=by[e.from],B=by[e.to];if(!A||!B)return;const a=C(A),b=C(B);
    const obs=nodes.filter(o=>o!==A&&o!==B&&!inside(o,A)&&!inside(o,B)&&!inside(A,o)&&!inside(B,o));
    if(!obs.some(o=>hit(a,b,o,6)))return;if(Math.abs(a.y-b.y)<Math.max(A.h,B.h)/2)return;
    const y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);const band=nodes.filter(o=>o.y<y1&&o.y+o.h>y0&&!inside(o,A)&&!inside(o,B));
    const xr=Math.max(A.x+A.w,B.x+B.w,...band.map(o=>o.x+o.w))+34,xl=Math.min(A.x,B.x,...band.map(o=>o.x))-34;
    const free=(p,q)=>!obs.some(o=>hit(p,q,o,6));for(const k of [{x:b.x,y:a.y},{x:a.x,y:b.y}]){if(free(a,k)&&free(k,b)){e.pts=[{x:Math.round(k.x),y:Math.round(k.y)}];return;}}
    const R=(xr-Math.max(a.x,b.x))<=(Math.min(a.x,b.x)-xl);const xs=R?xr+16*(lane.r++):xl-16*(lane.l++);e.pts=[{x:Math.round(xs),y:Math.round(a.y)},{x:Math.round(xs),y:Math.round(b.y)}];});};
function importPUML(raw){const c=PU.clean(raw);if(!c.lines.length)return{error:'Die Datei enthält keinen PlantUML-Code.'};
  const kind=PU.detect(c.lines);if(!kind)return{error:'Die Diagrammart konnte im PlantUML-Code nicht erkannt werden.'};
  const res={title:c.title,skipped:[]};let out;
  try{out=PU[kind==='class'?'cls':kind](c.lines,res);}catch(e){return{error:'Der PlantUML-Code konnte nicht gelesen werden ('+e.message+').'};}
  const d=out.data;const empty=CFG[out.type].seq?!d.parts.length:!d.nodes.length;if(empty)return{error:'Im PlantUML-Code wurden keine Elemente gefunden.'};
  out.skipped=res.skipped;return out;}


function loadPUML(raw,base){const r=importPUML(raw);if(r.error)return r.error;
  newDoc(r.type,r.data,r.data.title||base);if(!CFG[r.type].seq){PU.detour(E().data.nodes,E().data.edges,n=>G[n.id]);render();}closeModal(true);fit();renderProps();
  const sk=[...new Set(r.skipped)];
  if(sk.length){const p=mk('p',null,'„'+E().data.title+'“ wurde als '+CFG[r.type].name+' importiert und automatisch angeordnet. Folgendes konnte nicht übernommen werden:');
    const ul=mk('ul',{className:'skl'});sk.slice(0,15).forEach(x=>ul.appendChild(mk('li',null,x.length>90?x.slice(0,88)+' …':x)));if(sk.length>15)ul.appendChild(mk('li',null,'… und '+(sk.length-15)+' weitere'));
    const a=mk('div',{className:'mact'});const b=mk('button',{className:'pri'},'OK');b.onclick=()=>closeModal(true);a.append(b);openModal('PlantUML importiert',[p,ul,a]);}
  else toast('„'+E().data.title+'“ aus PlantUML importiert.');return null;}

function pumlEditor(t0){const f=mk('p');f.append('PlantUML-Code des Diagramms – z. B. für das IDE-Plugin oder ',mk('a',{href:'https://www.plantuml.com/plantuml',target:'_blank',rel:'noopener'},'plantuml.com'),'. Du kannst den Code hier ändern und mit „Übernehmen“ ins Diagramm zurückschreiben (rückgängig mit Strg+Z). Positionen bleiben erhalten, solange Elemente gleich heißen.');
  const ta=mk('textarea',{value:t0,spellcheck:false});const st=mk('span',{className:'st'});const a=mk('div',{className:'mact'});

  const bc=mk('button',null,'Kopieren');bc.onclick=()=>copyText(ta.value,()=>{ta.focus();ta.select();st.textContent='Text ist markiert, jetzt Strg+C drücken.';}).then(ok=>{if(ok)st.textContent='Kopiert.';});a.append(bu,bc);
  if(DL!==null){const bd=mk('button',null,'Herunterladen (.txt)');bd.onclick=()=>saveFile(baseName()+'-plantuml.txt',ta.value);a.append(bd);}a.append(st);openModal('PlantUML-Code – '+C().name,[f,ta,a]);}
function applyPUML(raw){const r=importPUML(raw);if(r.error)return r.error;
  if(r.type!==cur){return loadPUML(raw,'');}
  const old=E().data,d=r.data,info=[];const key=n=>n.type+'|'+(n.name||'').trim();commit();
  if(CFG[cur].seq){const om={};old.parts.forEach(p=>om[(p.name||'').trim()]=p);d.parts.forEach(p=>{const o=om[(p.name||'').trim()];if(o){['gapX','endOff'].forEach(k=>{if(o[k]!=null)p[k]=o[k];});}});
    const pn=id=>{const x=(old.parts.find(p=>p.id===id)||d.parts.find(p=>p.id===id)||{}).name;return x;};
    let lostAdj=false;old.msgs.forEach((m,i)=>{const n=d.msgs[i];const adj=m.pre||m.actOff||m.actFree;if(!adj)return;if(n&&pn(n.from)===pn(m.from)&&pn(n.to)===pn(m.to)){['pre','actOff','actFree'].forEach(k=>{if(m[k]!=null)n[k]=m[k];});}else lostAdj=true;});
    if(lostAdj)info.push('Individuelle Abstände oder Balkenlängen bei geänderten Nachrichten wurden zurückgesetzt.');
    (old.frags||[]).forEach((f,i)=>{const n=(d.frags||[])[i];if(n&&n.op===f.op){['exH','exW'].forEach(k=>{if(f[k]!=null)n[k]=f[k];});}});
    if(old.showFrame)d.showFrame=true;
    const lost=old.parts.filter(p=>!d.parts.some(q=>(q.name||'').trim()===(p.name||'').trim())).map(p=>p.name);if(lost.length)info.push('Nicht mehr enthalten: '+lost.join(', '));}
  else{const om={},idm={};old.nodes.forEach(n=>{if(!om[key(n)])om[key(n)]=n;});let hit=0;
    const cp=(n,o)=>{hit++;idm[n.id]=o.id;n.x=o.x;n.y=o.y;['w','h','cols','rows','lx','ly'].forEach(k=>{if(o[k]!=null)n[k]=JSON.parse(JSON.stringify(o[k]));});};
    const PSE=['initial','final','choice','history','flowfinal','decision','fork'];
    d.nodes.forEach(n=>{let o=om[key(n)];let kk=key(n);if(!o&&PSE.includes(n.type)){kk=Object.keys(om).find(k=>om[k].type===n.type);o=kk?om[kk]:null;}if(o){delete om[kk];cp(n,o);}});
    const unm=d.nodes.filter(n=>!idm[n.id]);unm.forEach(n=>{const kk=Object.keys(om).find(k=>om[k].type===n.type);if(kk){cp(n,om[kk]);delete om[kk];}});
    const rest=d.nodes.filter(n=>!idm[n.id]);if(rest.length&&hit){E().data=Object.assign(d,E().data.task&&!d.task?{task:E().data.task}:{});render();const ms=d.nodes.filter(n=>idm[n.id]&&G[n.id]);if(ms.length){const rx=Math.max(...ms.map(n=>G[n.id].x+G[n.id].w))+60;let y=Math.min(...ms.map(n=>G[n.id].y));
      rest.forEach(n=>{n.x=Math.round(rx);n.y=Math.round(y);y+=((G[n.id]&&G[n.id].h)||80)+30;});}}
    let lostEp=0;old.edges.forEach(e=>{const has=e.a1||e.a2||(e.pts&&e.pts.length)||e.lx!=null;const n=d.edges.find(x=>!x._m&&x.type===e.type&&idm[x.from]===e.from&&idm[x.to]===e.to);
      if(n){n._m=1;['a1','a2','pts','lx','ly','readDir'].forEach(k=>{if(e[k]!=null&&n[k]==null)n[k]=JSON.parse(JSON.stringify(e[k]));});}else if(has)lostEp++;});
    d.edges.forEach(x=>delete x._m);
    const lostN=Object.values(om).filter(n=>n.type!=='note').map(n=>n.name||(ndef(CFG[cur],n.type)||{}).label||'Form');const lostNotes=Object.values(om).filter(n=>n.type==='note').length;
    if(lostN.length)info.push('Nicht mehr enthalten: '+lostN.join(', '));if(lostNotes)info.push(lostNotes===1?'1 Notiz ist im Code nicht enthalten und wurde entfernt.':lostNotes+' Notizen sind im Code nicht enthalten und wurden entfernt.');
    if(lostEp)info.push('Bei '+lostEp+(lostEp===1?' Pfeil':' Pfeilen')+' gingen Knick- oder Anschlusspunkte verloren.');
    const fresh=d.nodes.length-hit;if(fresh)info.push(fresh===1?'1 neues Element wurde rechts neben das Diagramm gesetzt – ggf. verschieben.':fresh+' neue Elemente wurden rechts neben das Diagramm gesetzt – ggf. verschieben.');
    E().data=Object.assign(d,E().data.task&&!d.task?{task:E().data.task}:{});E().sel=null;pending=null;render();if(!hit){PU.detour(d.nodes,d.edges,n=>G[n.id]);}}
  d.title=old.title;E().data=Object.assign(d,E().data.task&&!d.task?{task:E().data.task}:{});E().sel=null;pending=null;render();if(info.some(x=>/neben das Diagramm/.test(x)))fit();renderProps();saveNow();if(typeof buildMenu==='function')buildMenu();
  const sk=[...new Set(r.skipped)].map(x=>'Nicht übernommen: '+x);const all=[...info,...sk];
  if(all.length){const p=mk('p',null,'Der Code wurde ins Diagramm übernommen. Bitte beachten:');const ul=mk('ul',{className:'skl'});all.slice(0,15).forEach(x=>ul.appendChild(mk('li',null,x.length>110?x.slice(0,108)+' …':x)));if(all.length>15)ul.appendChild(mk('li',null,'… und '+(all.length-15)+' weitere'));
    const a=mk('div',{className:'mact'});const b=mk('button',{className:'pri'},'OK');b.onclick=()=>closeModal(true);a.append(b);openModal('Code übernommen',[p,ul,a]);}
  else{closeModal(true);toast('Änderungen übernommen – Strg+Z macht sie rückgängig.');}return null;}
const openInput=$('#openFile');
openInput.addEventListener('change',()=>{const f=openInput.files&&openInput.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const err=loadFileText(String(r.result),null,f.name);if(err)openErr(err,f.name);openInput.value='';};r.readAsText(f);});

function openErr(msg,fname){const p=mk('p',null,msg);p.style.color='var(--ink)';const nodes=[];if(fname){const n=mk('p',null,'Datei: '+fname);nodes.push(n);}nodes.push(p);
  const a=mk('div',{className:'mact'});const ok=mk('button',{className:'pri'},'OK');ok.onclick=()=>{closeModal(true);if(!curDoc)chooser(true);};const bo=mk('button',null,'Andere Datei öffnen');bo.onclick=()=>{closeModal(true);openInput.click();};a.append(ok,bo);nodes.push(a);

  opts.forEach(([v,l,ic])=>{const b=mk('button',{type:'button'});b.dataset.v=String(v);if(v==='light'||v==='dark'||v==='system')b.dataset.themeSet=v;b.innerHTML=(ic?icon(ic,16):'')+'<span>'+esc(l)+'</span>';b.onclick=()=>{set(v);paint();};seg.append(b);});
  sec.append(seg);paint();return sec;}
function setCat(title,ic,rows){const w=mk('section',{className:'scat'});const h=mk('h3');h.innerHTML=icon(ic,17)+'<span>'+esc(title)+'</span>';const card=mk('div',{className:'scard'});card.append(...rows);w.append(h,card);return w;}
function setChk(title,label,get,set,hint){const sec=mk('div',{className:'setsec'});sec.append(mk('h3',null,title));const lab=mk('label',{className:'chk setchk'});const cb=mk('input',{type:'checkbox',checked:!!get()});cb.onchange=()=>set(cb.checked);lab.append(cb,' '+label);sec.append(lab);if(hint)sec.append(mk('p',{className:'sethint'},hint));return sec;}
function upd(k,v){SET[k]=v;saveSet();if(k==='font'){st0.textContent=ST0BASE+fontCSS()+styleCSS();render();}else if(k==='grid')applyView();else if(k==='hints')renderProps();else if(k==='minimap')schedOv();else if(k==='dstyle'){st0.textContent=ST0BASE+fontCSS()+styleCSS();render();}else if(k==='layout'){document.documentElement.classList.toggle('full',v!=='box');requestAnimationFrame(()=>{updInsets();fit();});}}
const STOR_MAX=5*1024*1024;
function storUsage(){const r={ok:true,total:0,doc:0,task:0,set:0,other:0,per:{}};try{const L=localStorage;for(let i=0;i<L.length;i++){const k=L.key(i),v=L.getItem(k)||'',n=k.length+v.length;r.total+=n;
  if(k.startsWith(PFX+'doc-')){r.doc+=n;const id=k.slice(PFX.length+4);r.per[id]=(r.per[id]||0)+n;}else if(k.startsWith(PFX+'task-')){r.task+=n;const id=k.slice(PFX.length+5);r.per[id]=(r.per[id]||0)+n;}else if(k.startsWith(PFX))r.set+=n;else r.other+=n;}}catch(_){r.ok=false;}return r;}
function storFmt(n){return n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1024/1024).toFixed(1).replace('.',',')+' MB';}
function storRow(){const w=mk('div',{className:'srow stor'});const u=storUsage();
  if(!u.ok){w.append(mk('div',{className:'sl'},''));w.firstChild.innerHTML='<b>Nicht verfügbar</b><small>Der Browser erlaubt hier keinen Speicher (z. B. privates Fenster). Diagramme bitte als Datei speichern.</small>';return w;}
  const pc=Math.min(100,u.total/STOR_MAX*100),lv=pc>=90?'crit':pc>=70?'warn':'';if(lv)w.classList.add(lv);
  const seg=(n,c)=>n>0?`<i class="${c}" style="width:${Math.max(.6,n/STOR_MAX*100).toFixed(2)}%"></i>`:'';
  const top=Object.entries(u.per).map(([id,n])=>({d:DOCS.find(x=>x.id===id),n})).filter(x=>x.d).sort((a,b)=>b.n-a.n).slice(0,3);
  w.innerHTML=`<div class="sl"><b>${storFmt(u.total)} von ca. 5 MB belegt <span class="stp ${lv}">${pc<1&&u.total>0?'&lt; 1':Math.round(pc)} %</span></b>
  <div class="stbar ${lv}" role="img" aria-label="${Math.round(pc)} Prozent belegt">${seg(u.doc,'sd')}${seg(u.task,'st')}${seg(u.set+u.other,'so')}</div>
  <div class="stleg"><span><i class="sd"></i>Diagramme ${storFmt(u.doc)}</span><span><i class="st"></i>Aufgaben inkl. Bilder ${storFmt(u.task)}</span><span><i class="so"></i>Sonstiges ${storFmt(u.set+u.other)}</span></div>
  ${top.length&&u.doc+u.task>200*1024?`<div class="sttop"><small>Größte Einträge:</small>${top.map(x=>`<span>${esc(docNames(x.d).join(' · '))} <em>${storFmt(x.n)}</em></span>`).join('')}</div>`:''}
  <small>${lv==='crit'?'Fast voll – neue Änderungen werden womöglich nicht mehr gespeichert. Diagramme als Datei sichern und alte unter „Meine Diagramme“ löschen.':lv==='warn'?'Wird knapp – vor allem Bilder in Aufgaben brauchen viel Platz. Wichtiges als Datei sichern.':'Alle Diagramme und Aufgaben liegen nur in diesem Browser auf diesem Gerät. Bilder in Aufgaben brauchen am meisten Platz.'}</small></div>`;
  return w;}
function settingsBox(){const g=mk('div',{className:'setgrid'});
  g.append(
    setCat('Erscheinungsbild','sun',[
      segRow('Farbschema',[['light','Hell','sun'],['dark','Dunkel','moon'],['system','System','monitor']],themePref,setTheme,'„System“ folgt der Einstellung des Betriebssystems.'),
      segRow('Zeichenfläche erweitern',[['full','Ein'],['box','Aus']],()=>SET.layout,v=>upd('layout',v),'Fläche über die ganze Seite, die Boxen schweben darüber.'),
      segRow('Übersichtskarte',[[true,'Ein'],[false,'Aus']],()=>SET.minimap,v=>upd('minimap',v),'Kleine Gesamtansicht unten rechts, wenn das Diagramm nicht ganz zu sehen ist.'),
      segRow('Hinweise anzeigen',[[true,'Ein'],[false,'Aus']],()=>SET.hints,v=>upd('hints',v),'„So geht’s“ und Erklärungen in der rechten Leiste.')]),
    setCat('Diagramm',CFG[ORDER[0]].tabIcon,[
      segRow('Stil',[['classic','Klassisch'],['modern','Modern']],()=>SET.dstyle,v=>upd('dstyle',v),'„Modern“: abgerundet mit farbigen Kopfzeilen und leichtem Schatten.'),
      segRow('Schriftgröße',[['normal','Normal'],['medium','Groß'],['large','Sehr groß']],()=>SET.font,v=>upd('font',v),'Größere Schrift für den Beamer – Elemente wachsen mit.')]),
    setCat('Raster','frag',[
      segRow('Raster anzeigen',[[true,'Ein'],[false,'Aus']],()=>SET.grid,v=>upd('grid',v),'Punktraster auf der Zeichenfläche.'),
      segRow('Am Raster ausrichten',[[0,'Aus'],[10,'Fein'],[20,'Grob']],()=>SET.snap,v=>upd('snap',v),'Fein = 10 px, Grob = 20 px (sichtbare Rasterpunkte).')]),
    setCat('Bild-Export (PNG)','image',[
      segRow('Auflösung',[[1,'1×'],[2,'2×'],[3,'3×']],()=>+SET.pngScale,v=>upd('pngScale',v),'3× für Druck und große Folien.'),
      segRow('Hintergrund',[['white','Weiß'],['transparent','Transparent']],()=>SET.pngBg,v=>upd('pngBg',v),'Transparent für farbige Folien.')]),
    setCat('Speicher im Browser','docs',[storRow()]));
  openModal('Einstellungen',[g]);modal.classList.add('welcome');}
$('#gear').innerHTML=icon('gear',20);$('#gear').onclick=()=>{closeMenu();settingsBox();};
function setTheme(t){if(t==='system')root.removeAttribute('data-theme');else root.dataset.theme=t;try{localStorage.setItem(PFX+'theme',t);}catch(_){}paintThemeBtn();}
{let t=null;try{t=localStorage.getItem(PFX+'theme');}catch(_){}if(t==='dark'||t==='light')root.dataset.theme=t;else root.removeAttribute('data-theme');}
mq.addEventListener&&mq.addEventListener('change',paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(root,{attributes:true,attributeFilter:['data-theme']});
paintThemeBtn();

/* ---------- Init ---------- */
{const last=LS.get(PFX+'cur');const start=VDOCS().find(d=>d.id===last)||[...VDOCS()].sort((a,b)=>b.updated-a.updated)[0];
  if(start)openDoc(start.id);else{buildPalette();buildMenu();chooser(true);}}
requestAnimationFrame(()=>{if(curDoc&&E().view&&E().view.k===1&&E().view.x===40)fit();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{render();});
window.addEventListener('pagehide',saveNow);
})();
</script>
